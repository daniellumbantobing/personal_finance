<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="finStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="finGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#finBg)" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5" filter="url(#finGlow)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Signature Infinity / Infinite Cashflow Ribbon -->
  <path d="M21 23 C14 23 10 27 10 32 C10 37 14 41 21 41 C27.5 41 30.5 37 32 34.5 C33.5 37 36.5 41 43 41 C50 41 54 37 54 32 C54 27 50 23 43 23 C36.5 23 33.5 27 32 29.5 C30.5 27 27.5 23 21 23 Z"
        fill="none"
        stroke="url(#finStroke)"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Inner Shine Overlay on Upper Left Loop -->
  <path d="M21 23 C16 23 12 26 11.5 29 C14.5 25 19 24 23 25"
        fill="none"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Upward Financial Spark (AI / Growth Node) -->
  <circle cx="43" cy="23" r="3.5" fill="#34d399"/>
  <circle cx="43" cy="23" r="1.5" fill="#ffffff"/>
</svg>

